name: Keep Alive — Evolution API (Render Free Tier)

on:
  schedule:
    # Roda a cada 14 minutos (Render dorme após 15 min sem requests)
    # O SaaS agora roda no Vercel e não precisa de ping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Evolution API
        continue-on-error: true
        env:
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
        run: |
          if [ -z "$EVOLUTION_API_URL" ]; then
            echo "⏭️ EVOLUTION_API_URL não configurado — adicione em Settings > Secrets > Actions"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$EVOLUTION_API_URL/")
          echo "Evolution API status: $STATUS"
          { [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; } && echo "✅ Evolution API OK" || echo "⚠️ Evolution API respondeu $STATUS"
